name: Release

# One pipeline for every push to main:
#   build (check + test + build once) -> release (tag + GitHub Release) -> deploy (that same build)
# Nothing is tagged or deployed unless the build job is green, and the deployed
# artifact is the exact one that was tested. The release PR is maintained last.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is due when package.json (bumped by the merged release PR) has no tag yet.
      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # A failing ls-remote (network/auth) aborts the step; only empty output means "no tag".
          tag=$(git ls-remote --tags origin "refs/tags/matchplanner-v$version")
          if [ -n "$tag" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version"
          fi

      # mise.toml is the single Node version source (bumped by Renovate); setup-node
      # cannot parse it itself, so read the pin here.
      - name: Read Node version
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: "npm"

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      - name: Build (base path = repo name, for project pages)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.plan.outputs.release == 'true'
        with:
          path: dist

  release:
    name: Tag and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Only runs for a merged release PR: creates the tag + GitHub Release on the tested commit.
      - name: Create tag and GitHub Release
        if: needs.build.outputs.release == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Open/update the next release PR (after the release exists, so nothing is left pending).
      - name: Maintain release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, release]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
