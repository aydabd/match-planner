name: Release

# Runs on every push to main, but only does real work when a release is due.
#
# Testing happens on pull requests (ci.yml): Check and E2E are required, and the
# main ruleset requires branches to be up to date before merging, so what lands
# on main is exactly what was tested. A normal merge therefore only refreshes the
# release PR here, with no checks and no e2e.
#
# When the merged release PR has bumped package.json to a version without a tag:
#   build (checks + unit tests + build once) -> release (tag + GitHub Release)
#   -> deploy (that same build)
# No e2e here: the release PR only changes the version and changelog, and the
# code it releases was already tested end to end before it reached main.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is due when package.json (bumped by the merged release PR) has no tag yet.
      - name: Check for an untagged version
        id: plan
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # A failing ls-remote (network/auth) aborts the step; only empty output means "no tag".
          tag=$(git ls-remote --tags origin "refs/tags/matchplanner-v$version")
          if [ -n "$tag" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released: only the release PR is updated."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version"
          fi

  build:
    name: Check and build
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml is the single Node version source (bumped by Renovate); setup-node
      # cannot parse it itself, so read the pin here.
      - name: Read Node version
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: "npm"

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Build (base path = repo name, for project pages)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  release:
    name: Tag and release
    needs: [plan, build]
    # Also runs when build was skipped (no release due), to keep the release PR current.
    # Never runs after a failed build.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Only for a merged release PR: creates the tag + GitHub Release on the checked commit.
      - name: Create tag and GitHub Release
        if: needs.plan.outputs.release == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Open/update the next release PR (after the release exists, so nothing is left pending).
      - name: Maintain release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [plan, build, release]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
