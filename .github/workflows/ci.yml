name: CI

# Pull requests only: this is where code is tested before it reaches main.
# Merges to main are not re-tested (the ruleset requires up-to-date branches, so
# main gets exactly what passed here); release.yml only checks and builds a release.
#
# Release PRs (release-please) only bump the version and changelog, so Check and
# E2E are skipped for them. A job skipped by `if` still satisfies required checks.
# "Detect changes" decides once whether a PR is a genuine release PR: the
# release-please branch, opened by github-actions[bot], from this repository.
# A branch name alone is not enough, so nobody can skip CI by naming a branch.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check
    needs: changes
    # Fail-safe: if Detect changes fails, its output is empty and Check still runs.
    if: ${{ !cancelled() && needs.changes.outputs.release_pr != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml is the single Node version source (bumped by Renovate); setup-node
      # cannot parse it itself, so read the pin here.
      - name: Read Node version
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: "npm"

      - run: npm ci

      - name: Static checks
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # E2E is a required check, so it must always report. Filtering the workflow with
  # `paths` would leave it missing and block the PR; a job skipped by `if` reports
  # success instead. Only files that can change what the app does trigger it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      release_pr: ${{ steps.release.outputs.release_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for a release PR
        id: release
        env:
          RELEASE_PR: >-
            ${{ startsWith(github.head_ref, 'release-please--')
            && github.event.pull_request.user.login == 'github-actions[bot]'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          echo "release_pr=$RELEASE_PR" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_PR" = "true" ]; then
            echo "Release PR (version and changelog only): Check and E2E will be skipped."
          fi

      - name: Check for app, test or build changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR: ${{ steps.release.outputs.release_pr }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_PR" = "true" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          # Markdown never changes behaviour, even inside src/ or e2e/.
          code=$(echo "$changed" | grep -v '\.md$' || true)
          # App code, the e2e suite, build/runtime config and dependencies. Docs,
          # rulesets, unit tests, lint config and workflows cannot change app behaviour.
          pattern='^(src/|public/|e2e/|index\.html$|package(-lock)?\.json$|mise\.(toml|lock)$|(vite|playwright)\.config\.ts$|tsconfig\.json$)'
          if echo "$code" | grep -Eq "$pattern"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "No behaviour-affecting changes: E2E will be skipped."
          fi

  e2e:
    name: E2E
    needs: changes
    # Skip only on an explicit "false"; if Detect changes fails, E2E still runs.
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Node version
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: "npm"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Same base path as GitHub Pages, so PRs test the configuration that ships.
      - name: End-to-end tests
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
